name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e ".[dev,aws]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src
      - name: Pytest
        run: python -m pytest
      - name: Reject tracked private artifacts
        shell: bash
        run: |
          if git ls-files | grep -vE '(^|/)\.env\.example$' | grep -E '(^|/)(\.env($|\.)|known_faces\.ya?ml$|.*token.*\.json$|.*\.(apk|aab|db|sqlite3?|jsonl|pem|p12|pfx)$)'; then
            echo "A private or generated artifact is tracked."
            exit 1
          fi

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android quality gate
        run: |
          chmod +x gradlew
          ./gradlew lintDebug testDebugUnitTest assembleDebug --no-daemon

