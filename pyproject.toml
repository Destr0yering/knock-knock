[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knock-knock"
version = "0.1.0"
description = "Privacy-conscious visitor recognition for Ring-connected homes and businesses."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "mangum>=0.19,<1.0",
  "python-multipart>=0.0.17,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyYAML>=6.0,<7.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
local-vision = [
  "numpy>=2.0,<3.0",
  "opencv-contrib-python-headless>=4.10,<5.0",
]
aws = ["boto3>=1.35,<2.0"]
dev = [
  "mypy>=1.13,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["knock_knock"]

[[tool.mypy.overrides]]
module = ["boto3", "cv2", "numpy", "yaml"]
ignore_missing_imports = true

